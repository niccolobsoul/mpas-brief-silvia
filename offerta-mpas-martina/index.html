<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Offerta MPAS - Riservato</title>
  <style>
    :root {
      --navy: #002d72;
      --orange: #fc4c02;
      --ink: #17212b;
      --muted: #66717a;
      --line: #e4ddd5;
      --paper: #fffdf9;
      --soft: #f6f1eb;
      --white: #ffffff;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: var(--paper);
      color: var(--ink);
      font-family: "Avenir Next", Avenir, "Helvetica Neue", Arial, sans-serif;
      letter-spacing: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .gate {
      width: min(100%, 430px);
      border: 1px solid rgba(0, 45, 114, .13);
      border-radius: 8px;
      background: var(--white);
      box-shadow: 0 20px 60px rgba(23, 33, 43, .08);
      padding: 34px;
    }

    .label {
      margin: 0 0 10px;
      color: var(--orange);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;
      color: var(--navy);
      font-size: clamp(24px, 5vw, 32px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    p {
      margin: 14px 0 24px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    form {
      display: grid;
      gap: 12px;
    }

    input,
    button {
      width: 100%;
      min-height: 48px;
      border-radius: 8px;
      font: inherit;
      font-size: 15px;
    }

    input {
      border: 1px solid var(--line);
      background: var(--soft);
      color: var(--ink);
      padding: 0 14px;
      outline: none;
    }

    input:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 3px rgba(252, 76, 2, .13);
    }

    button {
      border: 0;
      background: var(--orange);
      color: var(--white);
      font-weight: 700;
      cursor: pointer;
    }

    button:hover,
    button:focus-visible {
      background: #df4100;
    }

    .error {
      min-height: 18px;
      color: #b54735;
      font-size: 13px;
    }

    iframe {
      display: none;
      width: 100vw;
      height: 100vh;
      border: 0;
      background: var(--paper);
    }

    body.unlocked {
      display: block;
      min-height: 100vh;
      padding: 0;
      overflow: hidden;
    }

    body.unlocked .gate { display: none; }
    body.unlocked iframe { display: block; }

    @media (max-width: 520px) {
      body { padding: 16px; }
      .gate { padding: 26px 22px; }
    }
  </style>
</head>
<body>
  <main class="gate" aria-labelledby="page-title">
    <div class="label">Documento riservato</div>
    <h1 id="page-title">Offerta MPAS per Martina</h1>
    <p>Inserisci la password ricevuta per vedere la bozza dei tre blocchi di offerta.</p>
    <form id="password-form" autocomplete="off">
      <input id="password" type="password" placeholder="Password" aria-label="Password" autofocus>
      <button type="submit">Entra</button>
      <div class="error" id="error" role="status" aria-live="polite"></div>
    </form>
  </main>

  <iframe id="content" src="content.html" title="Offerta MPAS per Martina"></iframe>

  <script>
    const PASSWORD = "Minima05";
    const SESSION_KEY = "mpas_offerta_martina_auth";

    function unlock() {
      document.body.classList.add("unlocked");
    }

    if (sessionStorage.getItem(SESSION_KEY) === PASSWORD) {
      unlock();
    }

    document.getElementById("password-form").addEventListener("submit", function(event) {
      event.preventDefault();
      const input = document.getElementById("password");
      const error = document.getElementById("error");

      if (input.value === PASSWORD) {
        sessionStorage.setItem(SESSION_KEY, PASSWORD);
        unlock();
        return;
      }

      error.textContent = "Password non valida";
      input.value = "";
      input.focus();
    });
  </script>
</body>
</html>
