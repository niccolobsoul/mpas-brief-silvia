<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Martina Pro Aging Specialist - Brief protetto</title>
  <style>
    :root { --navy:#002d72; --orange:#fc4c02; --paper:#fffdf9; --ink:#152129; --muted:#5e6a70; --line:#e6e1db; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; background:linear-gradient(135deg, rgba(0,45,114,.08), rgba(252,76,2,.06)), var(--paper); color:var(--ink); font-family:"Avenir Next", Avenir, "Helvetica Neue", Arial, sans-serif; }
    .gate { width:min(520px, calc(100% - 32px)); background:white; border:1px solid var(--line); border-radius:16px; padding:34px; box-shadow:0 24px 70px rgba(0,45,114,.13); }
    .logo { width:220px; height:auto; margin-bottom:28px; }
    h1 { margin:0 0 12px; color:var(--navy); font-size:30px; line-height:1.12; letter-spacing:0; }
    p { margin:0 0 22px; color:var(--muted); font-size:16px; line-height:1.55; }
    label { display:block; margin:0 0 8px; color:var(--navy); font-weight:700; font-size:14px; }
    .row { display:flex; gap:10px; }
    input { flex:1; min-width:0; height:48px; border:1px solid var(--line); border-radius:8px; padding:0 13px; font-size:17px; color:var(--ink); }
    button { height:48px; border:0; border-radius:8px; padding:0 18px; background:var(--orange); color:white; font-size:15px; font-weight:800; cursor:pointer; }
    .error { min-height:22px; margin-top:14px; color:#b02020; font-size:14px; }
    .hint { margin-top:18px; color:var(--muted); font-size:13px; }
    @media (max-width:520px){ .row{display:block;} button{width:100%; margin-top:10px;} .gate{padding:26px;} }
  </style>
</head>
<body>
  <main class="gate">
    <img class="logo" src="assets/logo-mpas-color-orizz.png" alt="Martina Pro Aging Specialist">
    <h1>Brief protetto</h1>
    <p>Inserisci la password per aprire il Brand &amp; Messaging Brief.</p>
    <form id="form">
      <label for="password">Password</label>
      <div class="row">
        <input id="password" type="password" autocomplete="current-password" autofocus>
        <button type="submit">Apri</button>
      </div>
      <div class="error" id="error" role="alert"></div>
    </form>
    <div class="hint">Documento interno. Il contenuto della pagina e' cifrato nel file pubblicato.</div>
  </main>

    const saltB64 = '2NpO8sxF7lLJlSUEJ2rleA==';
    const ivB64 = 'b8ZAHLrH/lbXUxXG';
    const iterations = 250000;

    function b64ToBytes(value) {
      const binary = atob(value);
      const bytes = new Uint8Array(binary.length);
      for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      return bytes;
    }

    async function deriveKey(password) {
      const enc = new TextEncoder();
      const material = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: b64ToBytes(saltB64), iterations, hash: 'SHA-256' },
        material,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
    }

    async function unlock(password) {
      const combined = b64ToBytes(encryptedPayload);
      const key = await deriveKey(password);
      const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(ivB64) }, key, combined);
      const html = new TextDecoder().decode(plain);
      document.open();
      document.write(html);
      document.close();
    }

    document.getElementById('form').addEventListener('submit', async (event) => {
      event.preventDefault();
      const error = document.getElementById('error');
      error.textContent = '';
      try {
        await unlock(document.getElementById('password').value);
      } catch (err) {
        error.textContent = 'Password non corretta.';
      }
    });
